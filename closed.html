<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Baking with Alborz · back soon</title>
<style>
  :root {
    --bg: #fbf6ef; --paper: #fffdf9; --ink: #2d211b; --ink-soft: #6f5d52;
    --line: #e7dacb; --accent: #c0573f;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1512; --paper: #2a211c; --ink: #f3e9df; --ink-soft: #bba696; --line: #3d3029; --accent: #e98a70; }
  }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.55;
  }
  main {
    max-width: 440px; text-align: center; background: var(--paper);
    border: 1px solid var(--line); border-radius: 22px; padding: 40px 32px;
  }
  .cake { font-size: 52px; line-height: 1; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 30px; margin: 16px 0 8px; }
  p { margin: 0; color: var(--ink-soft); }
  .rule { width: 48px; height: 3px; border-radius: 3px; background: var(--accent); margin: 20px auto 0; }
</style>
</head>
<body>
<main>
  <div class="cake" aria-hidden="true">🎂</div>
  <h1>Baking with Alborz</h1>
  <p>The kitchen is closed for a little while for some fixes. Please check back soon.</p>
  <div class="rule"></div>
</main>
</body>
</html>
