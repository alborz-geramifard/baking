# Publishes Baking with Alborz to GitHub Pages on every push to main.
# Live at https://alborz-geramifard.com/baking/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # While "true", the site is closed: only closed.html is published (as the
  # home page and as the 404 page, so old recipe links land on it too) and
  # the page asks search engines not to index it. Set to "false" to reopen.
  SITE_PRIVATE: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the site itself, not the import script or repo files.
      - name: Collect site files
        if: env.SITE_PRIVATE != 'true'
        run: |
          mkdir _site
          cp index.html recipes.js _site/
          if [ -d images ]; then cp -R images _site/; fi
          touch _site/.nojekyll

      - name: Publish the "closed for now" page instead
        if: env.SITE_PRIVATE == 'true'
        run: |
          mkdir _site
          cp closed.html _site/index.html
          cp closed.html _site/404.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
